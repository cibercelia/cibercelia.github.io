<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="shield-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield Outline with Glow -->
  <path d="M50 8 L85 22 V50 C85 71 69 88 50 94 C31 88 15 71 15 50 V22 Z" 
        fill="url(#shield-bg)" 
        stroke="url(#cyber-grad)" 
        stroke-width="3" 
        filter="url(#glow)" />

  <!-- Inner Cyber Circuit Nodes -->
  <path d="M50 20 V34 M34 38 L43 45 M66 38 L57 45 M34 62 L43 55 M66 62 L57 55 M50 80 V66" 
        stroke="#00F0FF" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        opacity="0.6" />

  <!-- Node Circles -->
  <circle cx="50" cy="20" r="2.5" fill="#00F0FF" />
  <circle cx="34" cy="38" r="2.5" fill="#8B5CF6" />
  <circle cx="66" cy="38" r="2.5" fill="#8B5CF6" />
  <circle cx="34" cy="62" r="2.5" fill="#00F0FF" />
  <circle cx="66" cy="62" r="2.5" fill="#00F0FF" />
  <circle cx="50" cy="80" r="2.5" fill="#8B5CF6" />

  <!-- Center Terminal Prompt / Lock Icon -->
  <rect x="39" y="44" width="22" height="18" rx="4" fill="#0E1726" stroke="#00F0FF" stroke-width="2" />
  <path d="M44 44 V39 C44 35.7 46.7 33 50 33 C53.3 33 56 35.7 56 39 V44" 
        stroke="#8B5CF6" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        fill="none" />
  <!-- Terminal Prompt >_ inside lock -->
  <path d="M44 51 L47 53 L44 55 M49 55 H54" 
        stroke="#00F0FF" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
